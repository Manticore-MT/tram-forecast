<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--bg-page);font:var(--type-body-s)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font:var(--type-mono-s);color:var(--text-primary);mix-blend-mode:normal}.m{font:var(--type-mono-s);color:var(--text-muted)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div><div style="height:84px;background:var(--bg-surface);border-radius:var(--radius-lg);box-shadow:var(--inset-hairline)"></div><div class="m" style="margin-top:6px">surface</div></div><div><div style="height:84px;background:var(--bg-surface-2);border-radius:var(--radius-lg);box-shadow:var(--inset-hairline-strong), var(--shadow-md)"></div><div class="m" style="margin-top:6px">raised</div></div><div><div style="height:84px;background:var(--bg-elevated);border-radius:var(--radius-lg);box-shadow:var(--inset-hairline-strong), var(--shadow-lg)"></div><div class="m" style="margin-top:6px">overlay</div></div><div><div style="height:84px;background:var(--accent);border-radius:var(--radius-lg);box-shadow:var(--shadow-accent)"></div><div class="m" style="margin-top:6px">accent glow</div></div></div></body></html>
