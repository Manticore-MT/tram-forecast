<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--bg-page);font:var(--type-body-s)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font:var(--type-mono-s);color:var(--text-primary);mix-blend-mode:normal}.m{font:var(--type-mono-s);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div><div class="sw" style="background:var(--load-1)"></div><div class="m" style="margin-top:6px">--load-1</div><div style="font:var(--type-caption);color:var(--text-secondary)">Свободно</div></div><div><div class="sw" style="background:var(--load-2)"></div><div class="m" style="margin-top:6px">--load-2</div><div style="font:var(--type-caption);color:var(--text-secondary)">Комфортно</div></div><div><div class="sw" style="background:var(--load-3)"></div><div class="m" style="margin-top:6px">--load-3</div><div style="font:var(--type-caption);color:var(--text-secondary)">Умеренно</div></div><div><div class="sw" style="background:var(--load-4)"></div><div class="m" style="margin-top:6px">--load-4</div><div style="font:var(--type-caption);color:var(--text-secondary)">Плотно</div></div><div><div class="sw" style="background:var(--load-5)"></div><div class="m" style="margin-top:6px">--load-5</div><div style="font:var(--type-caption);color:var(--text-secondary)">Перегружено</div></div></div></body></html>
