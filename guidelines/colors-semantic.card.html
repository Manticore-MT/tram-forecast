<!-- @dsCard group="Colors" viewport="700x170" name="Semantic status" subtitle="Feedback states — never used as decoration" -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:18px;background:var(--bg-page);font:var(--type-body-s)}.g{display:grid;gap:10px}.sw{border-radius:var(--radius-md);height:64px;display:flex;align-items:flex-end;padding:8px;box-shadow:var(--inset-hairline)}.n{font:var(--type-mono-s);color:var(--text-primary);mix-blend-mode:normal}.m{font:var(--type-mono-s);color:var(--text-muted)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div><div class="sw" style="background:var(--status-ok)"></div><div class="m" style="margin-top:6px">--status-ok</div></div><div><div class="sw" style="background:var(--status-warn)"></div><div class="m" style="margin-top:6px">--status-warn</div></div><div><div class="sw" style="background:var(--status-danger)"></div><div class="m" style="margin-top:6px">--status-danger</div></div><div><div class="sw" style="background:var(--status-info)"></div><div class="m" style="margin-top:6px">--status-info</div></div></div></body></html>
