<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--bg-page)}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:14px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted);width:100%;margin:0 0 2px}</style>
</head><body><div id="root"></div><script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.DesignSystem_8e46b6;
const { Icon } = window.DesignSystem_8e46b6;
function Demo(){const [c,setC]=React.useState(true);const [s,setS]=React.useState(true);const [r,setR]=React.useState("a");return (<div>
<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14,marginBottom:16}}>
<Input label="Название команды" defaultValue="Manticore" hint="От 3 до 5 человек"/>
<Input label="Почта капитана" defaultValue="ask@" error="Укажите полный адрес" prefix={<Icon name="mail" size={16}/>}/>
<Select label="Маршрут" options={[{value:"3",label:"Трамвай 3"},{value:"17",label:"Трамвай 17"}]}/>
</div>
<div className="row"><p className="lbl">Checkbox · Radio · Switch</p>
<Checkbox checked={c} onChange={()=>setC(!c)} label="Согласен с политикой"/>
<Checkbox label="Получать рассылку"/>
<Radio name="tr" checked={r==="a"} onChange={()=>setR("a")} label="Трек 02"/>
<Radio name="tr" checked={r==="b"} onChange={()=>setR("b")} label="Трек 03"/>
<Switch checked={s} onChange={()=>setS(!s)} label="Доверительный интервал"/>
<Switch label="Авто-обновление"/></div>
</div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo/>);
</script></body></html>
